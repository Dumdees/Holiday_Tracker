name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - name: Zip the app folder
        run: zip -r "Monteith-Holiday-Manager.zip" "Monteith Holiday Manager"
      - uses: softprops/action-gh-release@v2
        with:
          files: Monteith-Holiday-Manager.zip
          generate_release_notes: true
