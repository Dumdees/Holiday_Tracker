name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v1.0.0 (the tag is created if it does not exist)'
        required: true
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path "Monteith Holiday Manager" -DestinationPath "Monteith-Holiday-Manager.zip"
      - name: Build the Windows installer
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}".TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "/DAppVersion=$ver" "installer\MonteithHolidayManager.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer\Output
      - name: Release notes
        shell: pwsh
        run: |
          $notes = "docs/release-notes/${{ env.VERSION }}.md"
          if (Test-Path $notes) { Copy-Item $notes release-body.md }
          else { Set-Content release-body.md "Download the file ending in Setup.exe below and double-click it to install." }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Monteith Holiday Manager ${{ env.VERSION }}
          body_path: release-body.md
          files: |
            installer/Output/*.exe
            Monteith-Holiday-Manager.zip
          generate_release_notes: true
