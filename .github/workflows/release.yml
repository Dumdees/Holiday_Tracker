name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - name: Zip the app folder
        run: zip -r "Monteith-Holiday-Manager.zip" "Monteith Holiday Manager"
      - name: Release notes
        run: |
          if [ -f "docs/release-notes/${{ github.ref_name }}.md" ]; then
            cp "docs/release-notes/${{ github.ref_name }}.md" release-body.md
          else
            echo "Download Monteith-Holiday-Manager.zip below, open it, and double-click Monteith Holiday Manager inside the folder." > release-body.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: Monteith Holiday Manager ${{ github.ref_name }}
          body_path: release-body.md
          files: Monteith-Holiday-Manager.zip
          generate_release_notes: true
